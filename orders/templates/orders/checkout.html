<h1>Checkout</h1>

<h2>Your Order</h2>

{% for item in cart_items %}
<div>
    <h3>{{ item.dish.name }}</h3>
    <p>Price: {{ item.dish.price }} PLN</p>
    <p>Quantity: {{ item.quantity }}</p>
    <p>Subtotal: {{ item.total_price }} PLN</p>
</div>
<hr>
{% endfor %}

<h2>Total: {{ cart.get_total_price }} PLN</h2>

<h2>Customer Information</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Place Order</button>
</form>

<a href="{% url 'cart_detail' %}">Back to Cart</a>
