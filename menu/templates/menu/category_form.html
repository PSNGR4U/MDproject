{% extends 'base.html' %}

{% block content %}
<div class="md-form-wrap">
    <div class="md-form-card">
        <div class="md-form-head">
            <h1>{{ title|default:"Kategoria menu" }}</h1>
            <p>Podaj nazwę kategorii i zapisz zmiany.</p>
        </div>

        <form method="POST" class="md-styled-form">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="md-form-actions">
                <button type="submit" class="btn btn-primary">Zapisz kategorię</button>
                <a href="{% url 'menu' %}" class="btn btn-outline">← Wróć do menu</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
