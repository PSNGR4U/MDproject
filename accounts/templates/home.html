{% extends 'base.html' %}
{% block content %}
<div class="home-container">
    <div class="welcome-card">
        <h1>Witaj w MDProject 🍔🍟</h1>
        <p>Twój ulubiony system zarządzania restauracją i zamówieniami.</p>

        <div class="action-buttons">
            {% if user.is_authenticated %}
                <p>Zalogowano jako: <strong>{{ user.username }}</strong></p>
                <a href="{% url 'logout' %}" class="btn btn-secondary">Wyloguj się</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-primary">Zaloguj się</a>
                <a href="{% url 'register' %}" class="btn btn-outline">Zarejestruj się</a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
