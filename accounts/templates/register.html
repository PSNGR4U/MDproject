{% extends 'base.html' %}
{% block content %}
<div class="auth-card">
    <h2>Utworzenie konta 📝</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Zarejestruj się</button>
    </form>
    <div class="auth-links">
        <p>Masz już konto??? <a href="{% url 'login' %}">Zaloguj się</a></p>
        <p><a href="{% url 'home' %}" style="color: #888; text-decoration: none;">← Strona główna</a></p>
    </div>
</div>
{% endblock %}
