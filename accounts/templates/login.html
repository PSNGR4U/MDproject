{% extends 'base.html' %}
{% block content %}
<div class="auth-card">
    <h2>Witaj w MDProject 🍔</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-submit">Zaloguj się</button>
    </form>
    <div class="auth-links">
        Nie masz konta? <a href="{% url 'register' %}">Zarejestruj się</a>
    </div>
</div>
{% endblock %}
